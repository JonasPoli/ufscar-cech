# Histórico de manutenções do portal público.
#
# Alimenta a página /novidades, a dica de novidade no topo de cada página e o selo "Novo" no menu
# (App\Service\Novidades\NovidadesService). Escreva para quem usa o portal: frases curtas, sem termos técnicos.
#
# Para manter em dia: `php bin/console app:novidades:pendentes` lista os commits do git que ainda não estão aqui.
# O commit que acrescenta uma entrada não consegue citar o próprio código; ele entra no histórico no commit seguinte.

# Até quando o menu mostra o selo "Novo" nas páginas da última atualização
destaque_ate: 2027-01-31

# Páginas novas que recebem o selo "Novo" no menu
novos_no_menu:
    - app_pub_search
    - app_pub_explore
    - app_pub_coauthorship
    - app_pub_projects

# Dica de novidade no topo de cada página: o que mudou e como era antes.
# `rotas` são os nomes de rota em que a dica aparece; `desde` é a data da atualização (a dica some quando a pessoa clica em "Entendi").
dicas:
    - rotas: [app_pub_search]
      desde: 2026-11-07
      titulo: A busca agora encontra especialistas
      antes: A busca listava docentes, produções e teses em blocos separados e só filtrava por departamento.
      agora: Ela mostra quem pesquisa o assunto, com as publicações que comprovam, filtra por área, vínculo, tipo e período, aceita a expressão exata e ordena por relevância.
    - rotas: [app_pub_coauthorship]
      desde: 2026-11-07
      titulo: Página nova de coautorias
      antes: A coautoria aparecia só como ranking e matriz, dentro dos Indicadores.
      agora: Um mapa interativo mostra quem publica junto no CECH. Clique numa pessoa (ou escolha um nome em "Destacar docente") para ver a vizinhança e os pares dela, ou numa ligação para ver as publicações do par.
    - rotas: [app_pub_explore, app_pub_explore_areas, app_pub_explore_major_areas, app_pub_explore_topic, app_pub_explore_area, app_pub_explore_major_area]
      desde: 2026-11-07
      titulo: Página nova para explorar a pesquisa
      antes: Os temas ficavam só na Pesquisa Temática, um de cada vez, sem as áreas do conhecimento.
      agora: Cada assunto, área de atuação e grande área tem uma página com a produção ao longo do tempo, os docentes, a rede de coautoria e as publicações.
    - rotas: [app_pub_projects, app_pub_project_show]
      desde: 2026-11-07
      titulo: Catálogo novo de projetos
      antes: Os projetos apareciam só dentro do perfil de cada docente, sem a equipe.
      agora: Todos os projetos estão numa página, com busca e filtros, e cada projeto mostra a equipe e os financiadores. O mesmo projeto aparece uma vez, mesmo quando vários docentes o declaram.
    - rotas: [app_pub_indicators]
      desde: 2026-11-07
      titulo: Panorama com filtros nos Indicadores
      antes: As figuras mostravam sempre o CECH inteiro.
      agora: O panorama do topo pode ser filtrado por assunto, departamento, tema e período, e mostra as pontes entre departamentos e entre grandes áreas. As figuras das abas continuam como antes.
    - rotas: [app_pub_professor_show]
      desde: 2026-11-07
      titulo: Perfil mais completo
      antes: O perfil não mostrava o vínculo com o CECH nem com quem o docente publica dentro do Centro.
      agora: Ele mostra o vínculo e o período no CECH, os assuntos em destaque e os coautores no Centro. Na aba de métricas há um mapa de colaboradores e, quando você chega pela busca, a aba "Publicações da busca".
    - rotas: [app_pub_home]
      desde: 2026-11-07
      titulo: Novidades no portal
      antes: A página inicial tinha uma busca simples e sugestões fixas.
      agora: A busca tem os modos Especialistas, Publicações e Pesquisador, e há atalhos para os assuntos mais frequentes, a rede de coautoria, o panorama e os projetos.
    - rotas: [app_pub_department_show]
      desde: 2026-11-07
      titulo: Panorama e rede do departamento
      antes: A página do departamento listava só o corpo docente.
      agora: Ela também mostra a produção do departamento ao longo do tempo, os assuntos em destaque e a rede de coautoria.
    - rotas: [app_pub_about, app_pub_about_data, app_pub_faq]
      desde: 2026-11-07
      titulo: Páginas novas sobre o portal
      antes: O portal não explicava de onde vinham os dados nem como usar os recursos.
      agora: Sobre nós, Sobre os dados e Dúvidas frequentes respondem a essas perguntas. O botão Acessibilidade, no topo, ajusta o tamanho do texto, o tema, o contraste, o espaçamento e as animações.

# Histórico, do mais recente para o mais antigo. Cada ajuste no git aparece com o código do commit.
entradas:
    - data: 2026-11-07
      titulo: Especialistas, coautorias, explorar e projetos
      resumo: A maior atualização desde o lançamento, a partir da comparação com a Plataforma Jabuticaba, da UFABC.
      mudancas:
          - A busca encontra quem pesquisa cada assunto e mostra as publicações que comprovam. Ganhou filtros de área, vínculo, tipo e período, a opção de expressão exata e a ordenação por relevância.
          - Página nova de Coautorias, com o mapa de quem publica junto no CECH e as publicações de cada parceria.
          - Página nova Explorar, com um panorama para cada assunto, área de atuação e grande área.
          - Catálogo novo de Projetos, com equipe e financiadores, sem repetir o projeto declarado por vários docentes.
          - Os Indicadores ganharam um panorama com filtros e as pontes entre departamentos e entre áreas.
          - O perfil mostra o vínculo e o período no CECH, os assuntos em destaque, os coautores no Centro e o mapa de colaboradores.
          - Cada departamento ganhou panorama e rede de coautoria.
          - Páginas novas Sobre nós, Sobre os dados, Dúvidas frequentes e esta lista de novidades, com dicas nas páginas que mudaram.
          - Painel de acessibilidade, com texto até 200%, tema, contraste, espaçamento e menos animações.
          - Dados abertos em formato para sistemas (API pública), para quem quiser reaproveitar as informações.
          - O cabeçalho ganhou duas linhas. Em cima fica o menu, com a página atual destacada; logo abaixo, a busca, com a escolha do tipo de busca e o atalho da tecla "/".
          - As páginas novas ganharam capa nas cores do CECH, cartões coloridos, ícones e as fotos dos docentes.
          - Na rede de coautoria, a lista de pares mostra a foto dos dois docentes. Quando você destaca um docente no grafo, ela passa a mostrar só os pares dele.
      commits:
          - {hash: "c122e9a", texto: "Projetos: a equipe e os financiadores de cada projeto passam a ser guardados, e o catálogo de projetos foi criado."}
          - {hash: "39b143e", texto: "Busca de especialistas, coautorias, explorar, panorama, perfil, acessibilidade e páginas sobre o portal."}
          - {hash: "3c55d44", texto: "Documentação: comparação com a Plataforma Jabuticaba e plano das mudanças."}
          - {hash: "b197a5e", texto: "Página de novidades com o histórico de manutenções, dicas nas páginas que mudaram e selo \"Novo\" no menu."}
          - {hash: "e370de1", texto: "Cabeçalho em duas linhas: menu em cima e busca logo abaixo."}
          - {hash: "2a67378", texto: "Visual novo das páginas novas: capa nas cores do CECH, cartões coloridos, fotos dos docentes e lista de pares que acompanha o docente destacado."}
          - {hash: "8ca858b", texto: "Organização interna: ferramenta para planejar cada mudança do portal por escrito antes de programá-la."}
          - {hash: "f9d8267", texto: "Documentação: descrição de como cada parte do portal funciona hoje, conferida no código."}
          - {hash: "fdaddf1", texto: "Correções: títulos com acentos aparecem certos na busca e no Explorar, a busca de teses aceita todos os filtros, \"Ver todas\" da página inicial lista as publicações recentes, a página do departamento mostra todos os docentes e o total de publicações de cada parceria passa a ser o real."}
          - {hash: "561adad", texto: "Documentação: guias atualizados para descrever o que o portal faz hoje."}

    - data: 2026-10-31
      titulo: Periódicos, Qualis e bases internacionais
      resumo: Ficou fácil ver onde os docentes publicam e como as revistas são avaliadas.
      mudancas:
          - Página nova de Periódicos, com a área CAPES, o Qualis e as bases em que cada revista está indexada, como Scopus, Web of Science e SciELO.
          - As várias grafias do nome de uma mesma revista passaram a ser reconhecidas como uma revista só.
          - Todos os currículos foram importados de novo do Lattes, com correções na leitura do currículo.
          - O selo Qualis aparece em cada revista da lista, e a página mostra quais bases foram somadas.
      commits:
          - {hash: "564113d", texto: "Página de periódicos, áreas CAPES e tesauro de grafias das revistas."}
          - {hash: "b108c09", texto: "Decisão sobre os nomes de revistas pendentes e comando de importação de currículos."}
          - {hash: "378dff6", texto: "Tesauro de categorias e uso dos tesauros em tudo o que depende das revistas."}
          - {hash: "e778c6b", texto: "Correção na leitura do currículo Lattes e nos caminhos de importação."}
          - {hash: "ee79e88", texto: "Documentação dos tesauros, da importação, dos comandos e da investigação das revistas."}
          - {hash: "4b8e8d8", texto: "Documentação: capacidade do servidor e números da reimportação."}
          - {hash: "9e4ed00", texto: "Documentação: ajuste do efeito da reimportação na capacidade do servidor."}
          - {hash: "27dc41f", texto: "Selo Qualis em cada linha da página de periódicos."}
          - {hash: "0dc8d8d", texto: "Documentação da arquitetura para crescer."}
          - {hash: "a193f8e", texto: "Lista das bases somadas e aviso de carregamento no filtro de periódicos."}

    - data: 2026-10-26
      titulo: Correções
      resumo: Ajustes pequenos, sem mudança na forma de usar o portal.
      mudancas:
          - Os gráficos da aba de métricas do perfil voltaram a carregar.
          - Um componente de envio de e-mails passou a ser baixado de outro endereço, na mesma versão.
      commits:
          - {hash: "7a8fc68", texto: "Correção nos gráficos da aba de métricas do perfil."}
          - {hash: "fd88350", texto: "Componente de envio de e-mails baixado do GitHub em vez do Bitbucket."}

    - data: 2026-09-23
      titulo: Teses e dissertações por docente
      resumo: A equipe do portal pode trazer as teses do Repositório da UFSCar para um docente de cada vez.
      mudancas:
          - No painel, as teses e dissertações do Repositório Institucional (TeD-UFSCar) podem ser importadas para um docente específico.
          - O painel deixou de dar erro em servidores que bloqueiam o ajuste de tempo de execução.
      commits:
          - {hash: "3b5b878", texto: "Importação de teses e dissertações do Repositório UFSCar por docente."}
          - {hash: "e2471ce", texto: "Correção de erro no painel quando o servidor bloqueia o ajuste de tempo."}

    - data: 2026-09-11
      titulo: Segurança e estabilidade
      resumo: O portal ficou mais protegido e mais fácil de acompanhar.
      mudancas:
          - As rotas que gravam dados passaram a exigir uma chave, e as fotos enviadas são conferidas.
          - Os erros em produção passaram a ser registrados num arquivo, com rotação.
          - No painel, a lista de revistas de cada base acadêmica pode ser exportada.
          - Foi feita uma revisão geral do código, com um relatório e a visão geral do sistema.
      commits:
          - {hash: "19ea49c", texto: "Exportação da lista de revistas de cada base acadêmica no painel."}
          - {hash: "b95a0a5", texto: "Registro dos erros de produção em arquivo, com rotação."}
          - {hash: "63932df", texto: "Chave obrigatória nas rotas que gravam dados e conferência das fotos enviadas."}
          - {hash: "07b2a9c", texto: "Ajuste no banco que destravou os testes automáticos."}
          - {hash: "a54b241", texto: "Documentação: visão geral do sistema e relatório da revisão de código."}

